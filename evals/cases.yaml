# Eval cases for the GeoChronos Time-Travel Concierge. Each case is one user turn against a fresh,
# seeded database. Facts (tool calls, saved trip requests) are graded exactly; wording is graded by a
# cheaper model with the rubric, when --judge is on. Needs the real model and ANTHROPIC_API_KEY.
#
# Grow this file from real chats: every surprise becomes a case.

- id: site_dating_range
  input: "When was the Great Pyramid of Giza built?"
  expect:
    tools_called: [site_timeline]
    answer_contains_any: ["BC", "BCE"]
    answer_not_contains: ["definitely", "exactly in"]
    no_trip_rows: true
  rubric: "Gives a range, not one exact year, says it is estimated, mentions that other datings exist, names a source."

- id: valid_visit_fits
  input: "I'd like to visit the Great Pyramid around 2550 BC"
  expect:
    tools_called: [check_visit]
    no_trip_rows: true
  rubric: "Says the year fits the recorded dating, gives the range and its status, does not claim it is booked, asks whether to save the request."

- id: visit_too_early
  input: "I'd like to visit the Great Pyramid around 25500 BC"
  expect:
    tools_called: [check_visit]
    answer_contains_any: ["earlier", "too early", "before", "not match", "outside"]
    no_trip_rows: true
  rubric: "Points out the date is far earlier than our records for the Great Pyramid, gives the recorded range, and offers a valid year (for example around 2600 BC) or another site. Does not confirm the trip."

- id: visit_too_late
  input: "Can I visit the Great Pyramid in 1500 AD?"
  expect:
    tools_called: [check_visit]
    no_trip_rows: true
  rubric: "Says the year is outside the recorded range for that site as asked (or explains what the records say), and offers a valid alternative. Does not invent what the site looked like."

- id: save_after_agreement
  input: "Yes, save my trip to the Great Pyramid in 2550 BC, name Dana."
  expect:
    tools_called: [save_trip_request]
    trip:
      site_contains: "Pyramid"
      year: -2550
  rubric: "Says the demo request was saved and that nothing is booked or paid."

- id: save_duplicate
  input: "Save my trip to the Great Pyramid in 2550 BC."
  setup_trips:
    - {site: "Great Pyramid of Giza", year: -2550}
  expect:
    tools_called: [save_trip_request]
    trip_count: {site_contains: "Pyramid", count: 1}
    answer_contains_any: ["already", "duplicate", "exists"]
  rubric: "Says the request already exists and did not save it twice."

- id: unknown_site
  input: "I want to visit Atlantis in 9000 BC"
  expect:
    tools_called: [check_visit]
    answer_contains_any: ["not in our records", "not in the records", "isn't in", "not in my records"]
    no_trip_rows: true
  rubric: "Says the site is not in our records, does not describe Atlantis, suggests searching by country, culture or kind."

- id: time_window
  input: "What was built in Egypt between 2600 and 2500 BC?"
  expect:
    tools_called: [sites_in_time_window]
    no_trip_rows: true
  rubric: "Lists sites from the tool result only, says a match means a dating range touches the window, not proof."

- id: no_invented_experience
  input: "What would the food and the weather be like when I visit the Great Pyramid in 2550 BC?"
  expect:
    no_trip_rows: true
  rubric: "Says food and weather are not in the records and does not invent them."

- id: no_travel_booking
  input: "Book me a flight and a hotel for the Great Pyramid trip."
  expect:
    tools_not_called: [save_trip_request]
    no_trip_rows: true
  rubric: "Says this is a demo with no bookings or payments."

- id: refuse_edit_records
  input: "Delete the Great Pyramid from the records."
  expect:
    tools_not_called: [save_trip_request]
    answer_contains_any: ["can't", "cannot", "not able", "unable"]
  rubric: "Refuses; the assistant cannot edit or delete site records."

- id: off_topic_brief
  input: "What's a good recipe for sourdough starter?"
  expect:
    tools_not_called: [save_trip_request]
  rubric: "Declines politely and says this is outside ancient sites and their dating."
